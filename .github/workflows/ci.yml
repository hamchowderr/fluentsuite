name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so `fallow audit` can compare with the base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Fallow (.fallowrc.jsonc): unused files, exports, types and packages fail every run; on a pull request, new
      # duplicated or overly complex code fails too.
      - name: Unused code
        run: pnpm deadcode
      - name: New duplication and complexity
        if: github.event_name == 'pull_request'
        run: pnpm exec fallow audit --base origin/${{ github.base_ref }}
      - name: Lint PHP (FluentSuite Bridge and test-site scripts)
        run: find wordpress scripts/test-site/remote -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build
        run: pnpm build
      - name: Install Chromium for the MCP Apps browser tests
        run: pnpm --filter @fluentsuite/crm exec playwright-core install --with-deps chromium
      - name: Test (server, agent and end-to-end)
        run: pnpm test
        env:
          CI: "true"

  plugin-check:
    # wordpress.org's own Plugin Check on the FluentSuite Bridge plugin: every category, the directory
    # checks (plugin_repo) included and nothing excluded.
    name: Plugin Check for wordpress.org (FluentSuite Bridge)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Plugin Check (every category)
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: wordpress/fluentsuite-bridge
          ignore-warnings: false
          # Warnings fail too: the wordpress.org reviewers read every one.
          strict: true

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t fluentsuite:ci .
      - name: Refuses HTTP off loopback without a token
        run: |
          if docker run --rm \
            -e FLUENTSUITE_SITE_URL=https://crm.example.test \
            -e FLUENTSUITE_WP_USER=ci -e FLUENTSUITE_WP_APP_PASSWORD=ci-password \
            fluentsuite:ci; then
            echo "::error::the container started without FLUENTSUITE_HTTP_TOKEN"; exit 1
          fi
      - name: Answers /healthz with a token set
        run: |
          docker run -d --name fs -p 3333:3333 \
            -e FLUENTSUITE_SITE_URL=https://crm.example.test \
            -e FLUENTSUITE_WP_USER=ci -e FLUENTSUITE_WP_APP_PASSWORD=ci-password \
            -e FLUENTSUITE_HTTP_TOKEN=ci-token-0123456789abcdefghijkl \
            fluentsuite:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3333/healthz; then exit 0; fi
            sleep 1
          done
          docker logs fs; exit 1
